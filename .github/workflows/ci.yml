name: ci

on:
  push:
  pull_request:

jobs:
  deny:
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses advisories

  check:
    name: authoritative validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      DISPLAY: ""
      WAYLAND_DISPLAY: ""
      XDG_RUNTIME_DIR: ${{ github.workspace }}/.ci-runtime
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install optional capture build dependencies
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libpipewire-0.3-dev
      - uses: Swatinem/rust-cache@v2
      - name: Prepare isolated runtime directory
        run: mkdir -p "$XDG_RUNTIME_DIR"
      - name: Cargo format gate
        timeout-minutes: 5
        run: cargo fmt --all --check
      - name: Cargo check gate (warnings denied)
        timeout-minutes: 15
        run: RUSTFLAGS="-D warnings" cargo check --all-targets
      - name: Cargo test gate
        timeout-minutes: 15
        run: cargo test --all-targets
      - name: Cargo Clippy gate (warnings denied)
        timeout-minutes: 15
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Repository dev-check gate
        timeout-minutes: 15
        run: bash scripts/dev-check.sh
      - name: Integration Smoke Test
        run: ./scripts/run-integration-smoke.sh
      - name: Resume Scenarios Smoke Test
        run: ./scripts/run-resume-scenarios.sh
      - name: Watchdog Auto-Recovery Smoke Test
        run: ./scripts/run-watchdog-auto-recovery.sh
      - name: Role-Scoped Recovery Execution Smoke Test
        run: ./scripts/run-role-scoped-recovery-execution.sh
      - name: Component Identity Mapping Smoke Test
        run: ./scripts/run-component-identity-mapping-smoke.sh
      - name: Lockd Identity and UI Path Smoke Test
        run: ./scripts/run-lockd-identity-and-ui-path-smoke.sh
      - name: Lockd Recovery Execution Optionalization Smoke Test
        run: ./scripts/run-lockd-recovery-execution-optionalization.sh

  xwin-screenshot-dev-harness-validation:
    name: xwin-screenshot dev-harness validation
    runs-on: ubuntu-latest
    needs: check
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: xwin-screenshot dev-harness check
        run: cargo check --workspace --features dev-harness
      - name: xwin-screenshot dev-harness test
        run: cargo test --workspace --features dev-harness
